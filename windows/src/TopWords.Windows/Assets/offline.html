<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Çevrimdışı</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0f172a; color: #f8fafc;
      font: 16px/1.6 system-ui, "Segoe UI", sans-serif;

    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #cbd5e1; }
    a {
      display: inline-block; padding: 10px 20px; border-radius: 10px;
      background: #38bdf8; color: #0f172a; font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Bağlantı kurulamadı</h1>
    <p>İnternet bağlantını kontrol edip tekrar dene.</p>

  </main>

</html>
